# Logrotate configuration for FreelanSign
# Place in /etc/logrotate.d/ on your VPS

# Backend Django logs (via Docker volume)
/var/lib/docker/volumes/freelansign_backend_logs_prod/_data/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0640 app app
    sharedscripts
    postrotate
        docker exec freelansign_backend_prod kill -USR1 1 2>/dev/null || true
    endscript
}

# Nginx access and error logs (via Docker volume)
/var/lib/docker/volumes/freelansign_nginx_logs_prod/_data/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0640 nginx nginx
    sharedscripts
    postrotate
        docker exec freelansign_frontend_prod nginx -s reopen 2>/dev/null || true
    endscript
}

# Weekly backups retained for 4 weeks
/var/lib/docker/volumes/freelansign_backend_logs_prod/_data/*.log.7.gz {
    weekly
    rotate 4
    missingok
    notifempty
}

# Monthly backups retained for 1 month
/var/lib/docker/volumes/freelansign_backend_logs_prod/_data/*.log.28.gz {
    monthly
    rotate 1
    missingok
    notifempty
}
