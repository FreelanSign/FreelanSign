# setup.cfg
[flake8]
max-line-length = 127
exclude =
    migrations,
    __pycache__,
    manage.py,
    settings.py,
    env,
    venv
ignore = E203, W503

[coverage:run]
source = .
omit =
    */migrations/*
    */venv/*
    */env/*
    manage.py
    */settings/*
    */tests/*
    */test_*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError

[tool:pytest]
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short

# Configuration black
[tool:black]
line-length = 127
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  migrations
  | __pycache__
)/
'''

# Configuration isort
[tool:isort]
profile = "black"
multi_line_output = 3
line_length = 127
skip = migrations
