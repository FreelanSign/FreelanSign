openapi: 3.0.3
info:
  title: FreelanSign REST API
  version: 0.1.0
  description: API documentation for the FreelanSign REST application
paths:
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      description: Obtain JWT tokens using email and password.
      summary: Login with email and password
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      summary: Logout (invalidate refresh token)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          content:
            application/json:
              schema:
                detail: Logged out successfully
          description: ''
        '400':
          content:
            application/json:
              schema:
                refresh:
                - Invalid token
          description: ''
  /api/auth/refresh/:
    post:
      operationId: api_auth_refresh_create
      summary: Refresh access token (with rotation and reuse detection)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
        '401':
          content:
            application/json:
              schema:
                detail: Token reuse detected
          description: ''
        '400':
          content:
            application/json:
              schema:
                refresh:
                - This field is required.
          description: ''
  /api/schema/:
