openapi: 3.0.3
info:
  title: FreelanSign REST API
  version: 0.1.0
  description: API documentation for the FreelanSign REST application
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Obtain JWT tokens using email and password.
      summary: Login with email and password
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Logout (invalidate refresh token)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          content:
            application/json:
              schema:
                detail: Logged out successfully
          description: ''
        '400':
          content:
            application/json:
              schema:
                refresh:
                - Invalid token
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      summary: Refresh access token (with rotation and reuse detection)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
        '401':
          content:
            application/json:
              schema:
                detail: Token reuse detected
          description: ''
        '400':
          content:
            application/json:
              schema:
                refresh:
                - This field is required.
          description: ''
  /api/branding/themes/:
    get:
      operationId: branding_themes_list
      description: List all themes for the authenticated user.
      summary: List all themes for the authenticated user
      tags:
      - Branding
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThemeListItem'
          description: ''
    post:
      operationId: branding_themes_create
      description: Create a new theme.
      summary: Create a new theme
      tags:
      - Branding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThemeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateThemeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateThemeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Theme'
          description: ''
  /api/branding/themes/{theme_id}/:
    get:
      operationId: branding_themes_retrieve
      description: Retrieve a specific theme.
      summary: Retrieve a specific theme
      parameters:
      - in: path
        name: theme_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Branding
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Theme'
          description: ''
    patch:
      operationId: branding_themes_partial_update
      description: Update a specific theme (partial update).
      summary: Update a specific theme
      parameters:
      - in: path
        name: theme_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Branding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateThemeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateThemeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateThemeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Theme'
          description: ''
    delete:
      operationId: branding_themes_destroy
      description: Delete a specific theme.
      summary: Delete a specific theme
      parameters:
      - in: path
        name: theme_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Branding
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/branding/themes/{theme_id}/activate/:
    post:
      operationId: branding_themes_activate_create
      description: Activate a specific theme.
      summary: Activate a specific theme
      parameters:
      - in: path
        name: theme_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Branding
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Theme'
          description: ''
  /api/branding/themes/{theme_id}/deactivate/:
    post:
      operationId: branding_themes_deactivate_create
      description: Deactivate a specific theme.
      summary: Deactivate a specific theme
      parameters:
      - in: path
        name: theme_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Branding
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Theme'
          description: ''
  /api/branding/themes/active/:
    get:
      operationId: branding_themes_active_retrieve
      description: Get the active theme for the authenticated user.
      summary: Get the active theme for the authenticated user
      tags:
      - Branding
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Theme'
          description: ''
  /api/catalog/areas/:
    get:
      operationId: catalog_areas_list
      description: |-
        ViewSet pour les domaines d'activité (areas).
        Implémentation classique (pas de use case pour ce cas simple).
      summary: Lister les domaines d'activité (areas)
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Recherche par nom
      tags:
      - Catalog
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAreaList'
          description: ''
  /api/catalog/areas/{id}/:
    get:
      operationId: catalog_areas_retrieve
      description: |-
        ViewSet pour les domaines d'activité (areas).
        Implémentation classique (pas de use case pour ce cas simple).
      summary: Lister les domaines d'activité (areas)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Area.
        required: true
      - in: query
        name: search
        schema:
          type: string
        description: Recherche par nom
      tags:
      - Catalog
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
          description: ''
  /api/catalog/prestations/:
    get:
      operationId: catalog_prestations_list
      description: Liste les prestations via le use case.
      summary: Lister les prestations
      parameters:
      - in: query
        name: area
        schema:
          type: integer
        description: Filtrer par ID d'Area
      - in: query
        name: ids
        schema:
          type: string
        description: Filtrer par liste d'IDs (comma-separated)
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Tri: name, -name, area, status, weight_days, default_rate_cents'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Recherche sur nom/description
      - in: query
        name: status
        schema:
          type: string
        description: Filtrer par statut (DRAFT, ACTIVE, ARCHIVED)
      tags:
      - Catalog
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPrestationList'
          description: ''
  /api/catalog/prestations/{id}/:
    get:
      operationId: catalog_prestations_retrieve
      description: Récupère une prestation via le use case.
      summary: Lister les prestations
      parameters:
      - in: query
        name: area
        schema:
          type: integer
        description: Filtrer par ID d'Area
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Prestation.
        required: true
      - in: query
        name: ids
        schema:
          type: string
        description: Filtrer par liste d'IDs (comma-separated)
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Tri: name, -name, area, status, weight_days, default_rate_cents'
      - in: query
        name: search
        schema:
          type: string
        description: Recherche sur nom/description
      - in: query
        name: status
        schema:
          type: string
        description: Filtrer par statut (DRAFT, ACTIVE, ARCHIVED)
      tags:
      - Catalog
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prestation'
          description: ''
