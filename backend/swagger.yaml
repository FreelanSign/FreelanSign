  /api/quotes/:
    get:
      operationId: quotes_list
      description: 'Views minces : délèguent au coeur applicatif (use cases).'
      summary: List quotes
      parameters:
      - in: query
        name: client
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: owner
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACCEPTED
          - CANCELLED
          - DRAFT
          - EXPIRED
          - PAID
          - REJECTED
          - SENT
        description: |-
          * `DRAFT` - Draft
          * `SENT` - Sent
          * `ACCEPTED` - Accepted
          * `REJECTED` - Rejected
          * `PAID` - Paid
          * `CANCELLED` - Cancelled
          * `EXPIRED` - Expired
      tags:
      - Quote
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuoteList'
          description: ''
    post:
      operationId: quotes_create
      description: 'Views minces : délèguent au coeur applicatif (use cases).'
      summary: Create a quote
      tags:
      - Quote
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuoteCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuoteCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteCreateUpdate'
          description: ''
