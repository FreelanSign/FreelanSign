  /api/user/:
    get:
      operationId: api_user_list
      summary: List all users
      tags:
      - Users
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
          description: ''
    post:
      operationId: api_user_create
      summary: Register a new user
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistration'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/user/me/:
    get:
      operationId: api_user_me_retrieve
      summary: Get current authenticated user
      tags:
      - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/user/me/change-password/:
    post:
      operationId: api_user_me_change_password_create
      summary: Change password for current user
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          content:
            application/json:
              schema:
                detail: Password changed successfully
          description: ''
  /api/user/me/profile/:
    patch:
      operationId: api_user_me_profile_partial_update
      summary: Update profile of current user
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
components:
  schemas:
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
      required:
      - current_password
      - new_password
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    PatchedProfileUpdate:
      type: object
      properties:
        first_name:
          type: string
          nullable: true
          maxLength: 255
        last_name:
          type: string
          nullable: true
          maxLength: 255
        birthday:
          type: string
          format: date
          nullable: true
        phone:
          type: string
          nullable: true
          maxLength: 20
        avatar_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        role:
          $ref: '#/components/schemas/RoleEnum'
    Profile:
      type: object
      properties:
        first_name:
          type: string
          nullable: true
          maxLength: 255
        last_name:
          type: string
          nullable: true
          maxLength: 255
        birthday:
          type: string
          format: date
          nullable: true
        phone:
          type: string
          nullable: true
          maxLength: 20
        avatar_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        role:
          $ref: '#/components/schemas/RoleEnum'
    RoleEnum:
      enum:
      - freelance
      - admin
      type: string
      description: |-
        * `freelance` - Freelance
        * `admin` - Admin
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        profile:
          allOf:
          - $ref: '#/components/schemas/Profile'
          readOnly: true
      required:
      - email
      - id
      - profile
    UserRegistration:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        profile:
          $ref: '#/components/schemas/Profile'
        full_name:
          type: string
        phone:
          type: string
      required:
      - email
      - password
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Auth
  description: JWT Authentication & session endpoints
- name: Users
  description: User & profile management
