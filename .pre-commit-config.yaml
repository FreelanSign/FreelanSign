# .pre-commit-config.yaml
repos:
  # Hooks génériques
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-json
      - id: pretty-format-json
        args: ['--autofix']

  # Hooks Python (Backend Django)
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        files: ^backend/
        language_version: python3

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        files: ^backend/
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        files: ^backend/
        args: ['--max-line-length=127', '--extend-ignore=E203,W503']
        additional_dependencies: [flake8-docstrings]

  # Hooks JavaScript/Vue (Frontend)
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        files: ^frontend/.*\.(js|jsx|ts|tsx|vue)$
        types: [file]
        additional_dependencies:
          - eslint@8.44.0
          - "@vue/eslint-config-typescript"
          - "eslint-plugin-vue"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0
    hooks:
      - id: prettier
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx, vue, css, scss, json, yaml, markdown]

  # Hook pour les tests Python (optionnel)
  - repo: local
    hooks:
      - id: django-tests
        name: Django Tests
        entry: bash -c 'cd backend && python manage.py test --keepdb'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
        stages: [pre-push]  # Seulement avant push, pas avant chaque commit

  # Hook personnalisé pour vérifier la structure du projet
  - repo: local
    hooks:
      - id: check-project-structure
        name: Check Project Structure
        entry: python scripts/check_structure.py
        language: python
        pass_filenames: false
        files: '(backend|frontend)/.*'
