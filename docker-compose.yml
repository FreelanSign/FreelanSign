services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: freelansign_postgres_prod
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-freelansign}
      POSTGRES_USER: ${DATABASE_USER:-fs_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-fs_password}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d  # Scripts d'initialisation
      - ./database/dumps:/dumps  # Pour les sauvegardes/imports
    networks:
      - freelansign_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-fs_user} -d ${DATABASE_NAME:-freelansign}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Django
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freelansign_backend
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - RESET_PASSWORD_URL=${RESET_PASSWORD_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      - RETENTION_POLICY_ENABLED=${RETENTION_POLICY_ENABLED:-True}
      - RETENTION_AUDIT_LOGS_DAYS=${RETENTION_AUDIT_LOGS_DAYS:-395}
      - RETENTION_ACCOUNTING_YEARS=${RETENTION_ACCOUNTING_YEARS:-10}
      - ENABLE_ACCOUNT_MODEL=${ENABLE_ACCOUNT_MODEL:-True}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # Hot reload en dev
      - backend_static:/app/static
      - backend_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - freelansign_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${NODE_ENV:-development}  # development ou production
    container_name: freelansign_frontend
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app  # Hot reload en dev
      - /app/node_modules  # Évite les conflits de node_modules
    depends_on:
      - backend
    networks:
      - freelansign_network

  # Service pour la gestion des dumps de base
  db-manager:
    image: postgres:15-alpine
    container_name: freelansign_db_manager
    environment:
      PGPASSWORD: ${DATABASE_PASSWORD:-fs_password}
    volumes:
      - ./database/dumps:/dumps
      - ./scripts:/scripts
    networks:
      - freelansign_network
    profiles:
      - tools  # Se lance uniquement avec --profile tools
    command: tail -f /dev/null  # Garde le conteneur actif

volumes:
  postgres_data:
  backend_static:
  backend_media:

networks:
  freelansign_network:
    driver: bridge
