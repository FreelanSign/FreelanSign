# PostgreSQL configuration optimized for 2GB RAM VPS
# Scaleway VPS-START-S (2GB RAM, 1 vCPU)

# Memory Configuration
shared_buffers = 256MB                # 25% of RAM for 1GB available
effective_cache_size = 1GB            # ~50% of total RAM
work_mem = 4MB                        # Per operation (sorted queries, joins)
maintenance_work_mem = 64MB           # For VACUUM, CREATE INDEX

# Connection Settings
max_connections = 50                  # Reduced for memory efficiency

# Write-Ahead Log
wal_buffers = 8MB
checkpoint_completion_target = 0.9

# Query Planning
random_page_cost = 1.1                # Assuming SSD storage
effective_io_concurrency = 200        # For SSD

# Logging (minimal for production)
log_min_duration_statement = 1000     # Log queries > 1s
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on

# Performance
autovacuum = on
autovacuum_max_workers = 2
